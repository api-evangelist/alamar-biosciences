aid: alamar-biosciences
name: Alamar Biosciences
description: >-
  Alamar Biosciences is a privately held life sciences company headquartered in Fremont,
  California, building precision proteomics tools aimed at the earliest detection of disease.
  Its NULISA (NUcleic acid Linked Immuno-Sandwich Assay) chemistry and Attobody reagents,
  run on the ARGO and ARGO HT automated immunoassay systems, deliver attomolar-sensitivity,
  high-multiplex protein measurement for biomarker discovery, translational research,
  neurodegeneration and immuno-oncology panels. Alamar publishes no public web API. Its
  developer-facing surface is open source rather than service based: the first-party
  NULISAseqR R package (GPL-3) for importing, normalizing, quality-controlling and analyzing
  NULISAseq XML output, documented at nulisaseqr.alamarbio.com, alongside the NULISA Analysis
  Software (NAS) that ships with the instruments.
